<style>
@font-face{font-family:"Bricolage";src:url(../fonts/Bricolage-normal.woff2) format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Madefor";src:url(../fonts/Madefor-normal.woff2) format("woff2");font-weight:400 800;font-display:swap}
:root{--black:#03050A;--navy:#0B1626;--cyan:#4FD3EE;--h:"Bricolage",system-ui,sans-serif;--b:"Madefor",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;font-family:var(--b);color:#fff;background:var(--black);
background:radial-gradient(700px 520px at 50% 18%,#13284A 0%,var(--navy) 42%,var(--black) 100%) fixed;-webkit-font-smoothing:antialiased}
a{color:inherit;-webkit-tap-highlight-color:transparent}
.card{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;min-height:100svh}
.sig{display:block;height:42px;width:auto;margin:0 auto 16px;opacity:.95}
.photo{width:min(62vw,250px);aspect-ratio:1080/1067;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(79,211,238,.35),0 24px 48px -20px rgba(0,0,0,.8);background:#0B1626}
.photo img{display:block;width:100%;height:100%;object-fit:contain}
h1{font-family:var(--h);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.015em;margin:18px 0 6px;text-align:center}
.title{font-family:var(--h);font-weight:600;font-size:15.5px;line-height:1.35;margin:0;text-align:center;color:#E6ECF5}
.title .dot{color:var(--cyan);padding:0 .25em}
.tag{font-family:var(--h);font-weight:600;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--cyan);margin:9px 0 0;text-align:center}
.links{list-style:none;margin:22px 0 0;padding:0;width:100%;display:flex;flex-wrap:wrap;justify-content:center;row-gap:14px}
.links li{width:25%;display:flex;justify-content:center}
.links a{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;width:100%;max-width:84px}
.ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);transition:background .2s,border-color .2s,transform .15s}
.ic svg{width:24px;height:24px;fill:none;stroke:var(--cyan);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic svg [fill="currentColor"]{fill:var(--cyan)}
.lb{font-family:var(--h);font-weight:600;font-size:12px;line-height:1.2;color:#D5DEEA;text-align:center;white-space:nowrap}
.links a:hover .ic,.links a:focus-visible .ic{background:rgba(79,211,238,.12);border-color:var(--cyan)}
.links a:active .ic{transform:scale(.94)}
.save{margin-top:24px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--cyan);color:var(--black);font-family:var(--h);font-weight:700;font-size:17px;letter-spacing:.01em;text-decoration:none;padding:16px 20px;border-radius:12px;box-shadow:0 14px 30px -14px rgba(79,211,238,.6);transition:background .2s,transform .15s}
.save svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.save:hover{background:#7FE1F4}.save:active{transform:scale(.98)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}
.foot{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.foot img{height:30px;width:auto;opacity:.9}
@media (max-height:740px){.photo{width:min(44vw,190px)}.sig{height:36px;margin-bottom:12px}h1{font-size:27px;margin-top:14px}.links{margin-top:18px;row-gap:12px}.save{margin-top:20px}}
@media (min-width:700px){.card{justify-content:center;padding-top:40px;padding-bottom:40px}.foot{margin-top:28px}}
</style>
